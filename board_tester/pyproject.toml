[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "openflightcomputer-board-tester"
version = "0.0.0"
description = "Computer-side manufacturing and acceptance-test controller for OpenFlightComputer boards"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyserial>=3.5,<4",
    "webcolors>=25.10,<26",
]

[project.scripts]
fc-test = "fc_test.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["fc_test*"]
